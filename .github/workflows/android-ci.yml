name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the Code (Clone Repository)
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up Java Environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle # Cache Gradle dependencies

      # Ensure server has security rights to run gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Scans code for errors, bugs, and performance issues
      - name: Run Android Lint
        run: ./gradlew lint

      # Executes all local tests in test folder
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # Compile the entire App
      - name: Build Debug APK
        run: ./gradlew assembleDebug